name: DevCine CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    name: Build Backend (Spring Boot)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./devcine-backend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        
    - name: Grant execute permission for gradlew/mvnw
      run: chmod +x mvnw
        
    - name: Compile and Build Backend
      # Bỏ qua test để build nhanh hơn, chỉ kiểm tra lỗi cú pháp
      run: ./mvnw clean package -DskipTests

  build-frontend:
    name: Build Frontend (Vue/Vite)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./devcine-frontend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './devcine-frontend/package-lock.json'
        
    - name: Install Dependencies
      run: npm install
      
    - name: Build Frontend Application
      run: npm run build
