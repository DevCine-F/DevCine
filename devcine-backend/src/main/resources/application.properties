spring.application.name=devcine-backend
server.port=${PORT:8080}
spring.profiles.active=dev
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Upload configurations
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# VNPAY Configurations (secret lấy từ biến môi trường / .env, không hardcode)
vnpay.tmnCode=${VNPAY_TMN_CODE}
vnpay.hashSecret=${VNPAY_HASH_SECRET}
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=${FRONTEND_URL:http://localhost:5173}/success
vnpay.version=2.1.0
vnpay.command=pay

# JWT
jwt.secret=${JWT_SECRET:DevCine_Super_Secret_Key_2026_Min32Chars_Required}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# CORS — origin cụ thể được phép (phẩy ngăn cách); prod set qua env CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

# Mail (Gmail SMTP) — credentials lấy từ env/.env, không hardcode
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Tên hiển thị người gửi + cờ bật/tắt gửi mail vé
mail.from=DevCine <${MAIL_USERNAME:devcinecinema@gmail.com}>
mail.enabled=${MAIL_ENABLED:true}

# Mật khẩu mặc định khi Admin tạo tài khoản nhân viên (buộc đổi ở lần đăng nhập đầu)
staff.default-password=${STAFF_DEFAULT_PASSWORD:DevCine@2026}

# Redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6382}

# Jackson configuration
spring.jackson.time-zone=Asia/Ho_Chi_Minh

